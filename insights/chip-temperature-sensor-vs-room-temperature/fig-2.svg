<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410"><rect width="1000" height="410" fill="#f5f9fa"/><g font-family="Arial,sans-serif" fill="#18334a"><text x="35" y="48" font-size="29" font-weight="bold">Same raw count. Different reference assumptions.</text><text x="35" y="90" font-size="22">Raw 12-bit ADC count: 891</text><g fill="#e0eef2"><rect x="35" y="120" width="445" height="175" rx="12"/><rect x="520" y="120" width="445" height="175" rx="12"/></g><g font-size="26"><text x="60" y="165">Reference: 3.300 V</text><text x="545" y="165">Reference: 3.267 V</text></g><g font-size="40" font-weight="bold"><text x="60" y="238">About 20.1°C</text><text x="545" y="238">About 24.3°C</text></g><text x="35" y="340" font-size="22">1% reference change → about 4.2°C interpretation difference</text><text x="35" y="382" font-size="19">Calculated using V = count × reference / 4096. Not measured warming.</text></g></svg>
