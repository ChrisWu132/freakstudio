<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740"><title>Three different serial test boundaries</title><rect width="600" height="740" fill="#f5f8f5"/><g font-family="Arial,sans-serif" fill="#163d3b"><text x="28" y="43" font-size="27" font-weight="bold">Where does the data turn back?</text><rect x="25" y="75" width="550" height="170" rx="12" fill="#dceee6"/><text x="48" y="113" font-size="26" font-weight="bold">1. Inside the UART</text><text x="48" y="154" font-size="22">TX engine → internal return → RX engine</text><text x="48" y="193" font-size="21">The external receive path is not exercised.</text><text x="48" y="222" font-size="21">Use the chip-specific test procedure.</text><rect x="25" y="267" width="550" height="170" rx="12" fill="#e1ecf1"/><text x="48" y="306" font-size="26" font-weight="bold">2. At a defined connector</text><text x="48" y="347" font-size="22">TX path → loopback point → RX path</text><text x="48" y="385" font-size="21">Only the included path is exercised.</text><text x="48" y="414" font-size="21">Record the exact location and wiring.</text><rect x="25" y="460" width="550" height="170" rx="12" fill="#fff0ce"/><text x="48" y="500" font-size="26" font-weight="bold">3. Through the real device</text><text x="48" y="541" font-size="22">Request → device → meaningful reply</text><text x="48" y="579" font-size="21">Check the actual protocol and behavior.</text><text x="48" y="608" font-size="21">One exchange is not a durability test.</text><text x="28" y="680" font-size="20">Conceptual test boundaries, not a wiring diagram.</text><text x="28" y="709" font-size="20">No hardware test results are shown here.</text></g></svg>
