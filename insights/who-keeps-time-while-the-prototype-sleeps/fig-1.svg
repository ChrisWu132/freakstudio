<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370"><rect width="1000" height="370" fill="#f5f9fa"/><g font-family="Arial,sans-serif" fill="#18334a"><text x="35" y="48" font-size="30" font-weight="bold">What must still work while the processor rests?</text><rect x="35" y="100" width="280" height="130" rx="16" fill="#d9edf0"/><text x="57" y="142" font-size="26">Time source</text><text x="57" y="190" font-size="23">Keeps producing ticks</text><rect x="360" y="100" width="280" height="130" rx="16" fill="#f5e6be"/><text x="382" y="142" font-size="26">Counter + alarm</text><text x="382" y="190" font-size="23">Detects the due time</text><rect x="685" y="100" width="280" height="130" rx="16" fill="#dfebd9"/><text x="707" y="142" font-size="26">Wake path</text><text x="707" y="190" font-size="23">Restarts useful work</text><path d="M321 164h31l-9 -8m9 8l-9 8M646 164h31l-9 -8m9 8l-9 8" stroke="#527c89" stroke-width="3" fill="none"/><text x="35" y="287" font-size="24">If the time source stops, setting an alarm is not enough.</text><text x="35" y="334" font-size="20">Concept only. Supply, clock and wake configuration still need verification.</text></g></svg>
