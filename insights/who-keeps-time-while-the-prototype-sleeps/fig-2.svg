<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510"><rect width="1000" height="510" fill="#f5f9fa"/><g font-family="Arial,sans-serif" fill="#18334a"><text x="35" y="48" font-size="30" font-weight="bold">A clock reference is not an alarm output.</text><text x="35" y="101" font-size="24" font-weight="bold">A. External reference; RP2040 keeps time</text><rect x="35" y="122" width="285" height="105" rx="14" fill="#d9edf0"/><text x="54" y="160" font-size="23">External clock source</text><text x="54" y="199" font-size="21">Continuous ticks</text><rect x="395" y="122" width="570" height="105" rx="14" fill="#dfebd9"/><text x="415" y="160" font-size="23">Clock input → internal RTC → alarm</text><text x="415" y="199" font-size="21">RP2040 wakes on its RTC event.</text><path d="M326 174h60l-10 -8m10 8l-10 8" stroke="#527c89" stroke-width="3" fill="none"/><text x="35" y="284" font-size="24" font-weight="bold">B. External RTC keeps time and sends the event</text><rect x="35" y="305" width="285" height="105" rx="14" fill="#f5e6be"/><text x="54" y="343" font-size="23">External RTC + alarm</text><text x="54" y="382" font-size="21">Alarm output changes</text><rect x="395" y="305" width="570" height="105" rx="14" fill="#dfebd9"/><text x="415" y="343" font-size="23">Wake GPIO → dormant-wake logic</text><text x="415" y="382" font-size="21">RP2040 wakes on the external signal.</text><path d="M326 357h60l-10 -8m10 8l-10 8" stroke="#527c89" stroke-width="3" fill="none"/><text x="35" y="461" font-size="22">The timing circuit and wake path must remain operational.</text><text x="35" y="492" font-size="19">Signal roles only; not a pin-level circuit or tested implementation.</text></g></svg>
